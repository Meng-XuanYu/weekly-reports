name: Deploy private reports

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify the snapshot is still current
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$latest" = "$GITHUB_SHA" || { echo 'This snapshot has been superseded.'; exit 1; }
          sha="$(cat source-ref.txt)"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Read private source
        uses: actions/checkout@v6
        with:
          repository: Meng-XuanYu/weekly-reports-source
          ref: ${{ steps.source.outputs.sha }}
          ssh-key: ${{ secrets.QUARTZ_SOURCE_READ_KEY }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: private-source/package-lock.json
      - name: Install site dependencies
        working-directory: private-source
        run: npm ci --no-audit --no-fund
      - name: Install Quartz plugins
        working-directory: private-source
        run: npx quartz plugin install --from-config
      - name: Build the website privately in the runner
        working-directory: private-source
        run: |
          if ! npx quartz build --concurrency 2 > "$RUNNER_TEMP/quartz-build.log" 2>&1; then
            echo '::error::Quartz build failed. Reproduce the build in the private source repository; report content is intentionally omitted from public logs.'
            exit 1
          fi
          test -s public/index.html
          if find public -name '*.md' -print -quit | grep -q .; then
            echo '::error::Refusing to deploy raw Markdown files.'
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - name: Upload current website
        uses: actions/upload-pages-artifact@v4
        with:
          path: private-source/public
          retention-days: 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Delete all build packages, including the deployed package
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[].id' > "$RUNNER_TEMP/build-packages"
          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done < "$RUNNER_TEMP/build-packages"
      - name: Remove previous build artifacts and runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | .id' > "$RUNNER_TEMP/previous-runs"
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            [ "$run_id" != "$GITHUB_RUN_ID" ] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
          done < "$RUNNER_TEMP/previous-runs"
      - name: Remove previous deployment records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=100" \
            --jq '.[] | [.id, .sha] | @tsv' > "$RUNNER_TEMP/previous-deployments"
          while IFS=$'\t' read -r deployment_id deployment_sha; do
            [ -n "$deployment_id" ] || continue
            [ "$deployment_sha" != "$GITHUB_SHA" ] || continue
            gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
              -f state=inactive --silent
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/deployments/$deployment_id"
          done < "$RUNNER_TEMP/previous-deployments"
